basePath: /
definitions:
  handlers.APIKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
      role:
        $ref: '#/definitions/model.APIKeyRole'
    type: object
  handlers.CreatedAPIKeyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      key:
        type: string
      name:
        type: string
      prefix:
        type: string
      revoked_at:
        type: string
      role:
        $ref: '#/definitions/model.APIKeyRole'
    type: object
  handlers.DataFreshnessResponse:
    properties:
      datasets:
        items:
          $ref: '#/definitions/handlers.DatasetFreshnessResponse'
        type: array
    type: object
  handlers.DatasetFreshnessResponse:
    properties:
      id:
        type: string
      last_successful_ingest_at:
        type: string
      last_successful_ingest_duration:
        type: string
      last_successful_job_id:
        type: string
      latest_period:
        $ref: '#/definitions/handlers.FreshnessPeriodResponse'
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handlers.FreshnessPeriodResponse:
    properties:
      as_of:
        description: AsOf is the snapshot timestamp of the last completed replace.
          Omitted when no completed job exists.
        type: string
      month:
        description: Month is set when Type is "month" (1-12).
        type: integer
      row_count:
        description: RowCount is the replaced table size for a snapshot. For weather_stations
          this is the station catalog; the snapshot is also present when airport_weather_stations
          has rows.
        type: integer
      type:
        description: Type is "month" or "snapshot".
        type: string
      year:
        description: Year is set when Type is "month".
        type: integer
    type: object
  handlers.IngestJobResponse:
    properties:
      id:
        type: string
      month:
        type: integer
      status:
        $ref: '#/definitions/model.JobStatus'
      year:
        type: integer
    type: object
  handlers.IngestResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/handlers.IngestJobResponse'
        type: array
      months_requested:
        type: integer
    type: object
  handlers.JobResponse:
    properties:
      created_at:
        type: string
      ended_at:
        type: string
      error:
        type: string
      id:
        type: string
      month:
        type: integer
      result:
        items:
          type: integer
        type: array
      started_at:
        type: string
      stations:
        items:
          type: string
        type: array
      status:
        $ref: '#/definitions/model.JobStatus'
      type:
        $ref: '#/definitions/model.JobType'
      updated_at:
        type: string
      year:
        type: integer
    type: object
  handlers.MonthIngestConflictResponse:
    properties:
      active_ingest_months:
        items:
          $ref: '#/definitions/model.YearMonth'
        type: array
      error:
        type: string
      existing_data_months:
        items:
          $ref: '#/definitions/model.YearMonth'
        type: array
    type: object
  handlers.QueuedJobResponse:
    properties:
      id:
        type: string
      status:
        $ref: '#/definitions/model.JobStatus'
      type:
        $ref: '#/definitions/model.JobType'
    type: object
  handlers.RebuildTravelWindowsConflictResponse:
    properties:
      error:
        type: string
      job_type:
        $ref: '#/definitions/model.JobType'
    type: object
  handlers.RebuildTravelWindowsResponse:
    properties:
      job:
        $ref: '#/definitions/handlers.QueuedJobResponse'
    type: object
  handlers.RebuildWeatherStatsConflictResponse:
    properties:
      error:
        type: string
      job_type:
        $ref: '#/definitions/model.JobType'
    type: object
  handlers.RebuildWeatherStatsResponse:
    properties:
      job:
        $ref: '#/definitions/handlers.QueuedJobResponse'
    type: object
  handlers.ReferenceIngestConflictResponse:
    properties:
      dataset:
        type: string
      error:
        type: string
      job_type:
        $ref: '#/definitions/model.JobType'
    type: object
  handlers.ReferenceIngestResponse:
    properties:
      job:
        $ref: '#/definitions/handlers.QueuedJobResponse'
    type: object
  handlers.StatusResponse:
    properties:
      status:
        type: string
    type: object
  handlers.WeatherIngestJobResponse:
    properties:
      id:
        type: string
      month:
        type: integer
      stations:
        items:
          type: string
        type: array
      status:
        $ref: '#/definitions/model.JobStatus'
      year:
        type: integer
    type: object
  handlers.WeatherIngestResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/handlers.WeatherIngestJobResponse'
        type: array
      months_requested:
        type: integer
      unresolved_airports:
        items:
          type: string
        type: array
    type: object
  model.APIKeyRole:
    enum:
    - consumer
    - subscriber
    - admin
    type: string
    x-enum-varnames:
    - APIKeyRoleConsumer
    - APIKeyRoleSubscriber
    - APIKeyRoleAdmin
  model.AirportCount:
    properties:
      airport:
        type: string
      count:
        type: integer
    type: object
  model.Analysis:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      end:
        type: string
      sample_reason:
        description: |-
          empty_sample means the slot has no flights: confidence is unknown and estimates are null.
          sufficient is high confidence; insufficient_sample is low.
        enum:
        - sufficient
        - insufficient_sample
        - empty_sample
        type: string
      sample_size:
        type: integer
      start:
        type: string
    type: object
  model.CarrierAirportStat:
    properties:
      airport:
        type: string
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierOnTime:
    properties:
      carrier:
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierRouteStat:
    properties:
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      dest:
        type: string
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
      origin:
        type: string
    type: object
  model.CarrierStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      best_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      best_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
      worst_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      worst_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
    type: object
  model.ConnectionGuidance:
    properties:
      domestic_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      domestic_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
    type: object
  model.ConnectionMinutes:
    properties:
      loose_minutes:
        type: integer
      mct_source:
        description: MCTSource is airport when this bucket used the stored airport
          minute, or default when that minute was missing.
        enum:
        - airport
        - default
        type: string
      recommended_minutes:
        type: integer
    type: object
  model.CreateAPIKeyRequest:
    properties:
      name:
        maxLength: 100
        type: string
      role:
        type: string
    required:
    - name
    - role
    type: object
  model.DelayCausesAvgMinutes:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      weather:
        type: number
    type: object
  model.DelayCausesShare:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      unattributed:
        type: number
      weather:
        type: number
    type: object
  model.Filters:
    properties:
      carrier:
        type: string
      day_of_week:
        type: integer
      days_of_week:
        items:
          type: integer
        type: array
      dep_time:
        type: string
      dep_time_window_minutes:
        type: integer
      dest:
        type: string
      end_date:
        type: string
      flight_number:
        type: string
      origin:
        type: string
      start_date:
        type: string
      state:
        type: string
    type: object
  model.ForceIngestRequest:
    description: An empty body is treated as {"force":false}. Set force=true to replace
      existing rows.
    properties:
      force:
        type: boolean
    type: object
  model.IngestRequest:
    properties:
      end_month:
        maximum: 12
        minimum: 1
        type: integer
      end_year:
        minimum: 2018
        type: integer
      force:
        type: boolean
      start_month:
        maximum: 12
        minimum: 1
        type: integer
      start_year:
        minimum: 2018
        type: integer
    required:
    - start_month
    - start_year
    type: object
  model.ItineraryConnection:
    properties:
      after_leg:
        type: integer
      airport:
        type: string
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      connection_type:
        enum:
        - domestic_to_domestic
        - domestic_to_international
        - international_to_domestic
        - international_to_international
        type: string
      layover_minutes:
        type: integer
      loose_minutes:
        type: integer
      mct_source:
        description: Null when this hop did not use a connection bucket.
        enum:
        - airport
        - default
        type: string
      overnight:
        description: Overnight stays true for a later outbound date, including multi-day,
          when reason names another cause.
        type: boolean
      reason:
        description: Reason is why status is unknown. overnight means a later date
          was still classified. empty_sample and insufficient_sample match the inbound
          sample_reason; missing_outlook does not.
        enum:
        - evaluated
        - overnight
        - multi_airport
        - missing_country
        - missing_outlook
        - empty_sample
        - insufficient_sample
        - missing_threshold
        - negative_layover
        - invalid_schedule
        type: string
      recommended_minutes:
        type: integer
      slack_minutes:
        type: integer
      status:
        enum:
        - loose
        - ok
        - tight
        - unknown
        type: string
    type: object
  model.ItineraryLeg:
    properties:
      arr_time:
        type: string
      carrier:
        type: string
      date:
        type: string
      dep_time:
        type: string
      dep_time_window_minutes:
        maximum: 120
        minimum: 1
        type: integer
      dest:
        type: string
      origin:
        type: string
    required:
    - arr_time
    - carrier
    - date
    - dep_time
    - dest
    - origin
    type: object
  model.ItineraryOutlookLeg:
    properties:
      date:
        type: string
      error:
        type: string
      index:
        type: integer
      outlook:
        $ref: '#/definitions/model.RouteOutlook'
    type: object
  model.ItineraryOutlookRequest:
    properties:
      legs:
        items:
          $ref: '#/definitions/model.ItineraryLeg'
        maxItems: 4
        minItems: 2
        type: array
    required:
    - legs
    type: object
  model.ItineraryOutlookResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/model.ItineraryConnection'
        type: array
      legs:
        items:
          $ref: '#/definitions/model.ItineraryOutlookLeg'
        type: array
      summary:
        $ref: '#/definitions/model.ItineraryOutlookSummary'
    type: object
  model.ItineraryOutlookSummary:
    properties:
      confidence:
        description: A missing outlook counts as unknown.
        enum:
        - high
        - low
        - unknown
        type: string
      connection_risk:
        description: True when any connection is tight or unknown.
        type: boolean
      destination:
        type: string
      origin:
        type: string
    type: object
  model.JobStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - JobStatusPending
    - JobStatusRunning
    - JobStatusCompleted
    - JobStatusFailed
  model.JobType:
    enum:
    - import_flight_performance
    - import_weather_observations
    - import_countries
    - import_regions
    - import_airports
    - import_airport_mct
    - import_weather_stations
    - rebuild_route_travel_windows
    - rebuild_route_weather_stats
    type: string
    x-enum-varnames:
    - JobTypeImportFlightPerformance
    - JobTypeImportWeatherObservations
    - JobTypeImportCountries
    - JobTypeImportRegions
    - JobTypeImportAirports
    - JobTypeImportAirportMCT
    - JobTypeImportWeatherStations
    - JobTypeRebuildRouteTravelWindows
    - JobTypeRebuildRouteWeatherStats
  model.RouteOutlook:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      cancellation_probability:
        type: number
      connection:
        allOf:
        - $ref: '#/definitions/model.ConnectionGuidance'
        description: Cleared for empty_sample and insufficient_sample.
      delay_probability:
        type: number
      diversion_probability:
        type: number
      filters:
        $ref: '#/definitions/model.Filters'
      likely_arrival_delay_minutes:
        type: number
      likely_arrival_delay_when_delayed:
        type: number
      likely_departure_delay_minutes:
        type: number
      likely_departure_delay_when_delayed:
        type: number
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time_probability:
        type: number
      weather:
        $ref: '#/definitions/model.RouteOutlookWeather'
    type: object
  model.RouteOutlookWeather:
    properties:
      dest:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
      origin:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
    type: object
  model.RouteOutlookWeatherSide:
    properties:
      adverse_delta:
        description: AdverseDelta is adverse_on_time_rate minus fair_on_time_rate,
          or null unless both rates exist.
        type: number
      adverse_flights:
        description: AdverseFlights counts adverse-category flights. UNKNOWN and unmatched
          flights are excluded.
        type: integer
      adverse_on_time_rate:
        description: AdverseOnTimeRate is null when this side has no adverse flights.
        type: number
      confidence:
        description: Confidence is unknown when fair or adverse flights are absent,
          and low when the thinner group is below the outlook minimum. A thin sample
          keeps its rates.
        enum:
        - high
        - low
        - unknown
        type: string
      fair_on_time_rate:
        description: FairOnTimeRate is null when this side has no VFR_FAIR flights.
        type: number
    type: object
  model.RouteStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      carrier_on_time:
        description: Present only when the carrier query filter is omitted. Sorted
          by on_time_rate desc, then flights desc, then carrier asc.
        items:
          $ref: '#/definitions/model.CarrierOnTime'
        type: array
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_airports:
        items:
          $ref: '#/definitions/model.AirportCount'
        type: array
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.RouteTravelWindows:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      best_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      best_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      best_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      by_day_of_week:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      by_hour:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      by_month:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      filters:
        $ref: '#/definitions/model.Filters'
      worst_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      worst_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      worst_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
    type: object
  model.RouteWeatherStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      dest_weather:
        $ref: '#/definitions/model.WeatherSideStats'
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      origin_weather:
        $ref: '#/definitions/model.WeatherSideStats'
    type: object
  model.TravelWindowDayBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      day_of_week:
        type: integer
      flights:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowHourBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      hour:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowMonthBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      month:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.WeatherCategoryStat:
    properties:
      category:
        enum:
        - Thunder
        - Very low clouds or visibility
        - Low clouds or visibility
        - Somewhat reduced visibility
        - Windy
        - Precipitation
        - Fair
        - Unknown
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.WeatherIngestRequest:
    properties:
      end_month:
        maximum: 12
        minimum: 1
        type: integer
      end_year:
        minimum: 2018
        type: integer
      force:
        type: boolean
      start_month:
        maximum: 12
        minimum: 1
        type: integer
      start_year:
        minimum: 2018
        type: integer
      stations:
        items:
          type: string
        type: array
    required:
    - start_month
    - start_year
    - stations
    type: object
  model.WeatherSideStats:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.WeatherCategoryStat'
        type: array
      flights:
        type: integer
      flights_unmatched:
        type: integer
    type: object
  model.YearMonth:
    properties:
      month:
        type: integer
      year:
        type: integer
    type: object
  store.MigrationVersion:
    properties:
      dirty:
        type: boolean
      version:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'REST API for flight data ingest, job status, route performance, and
    carrier performance. Protected routes require an API key (`Authorization: Bearer
    <key>` or `X-API-Key`). Rate-limited responses return 429 with `Retry-After`,
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.'
  title: flight-tracker API
  version: "1.0"
paths:
  /api/db/version:
    get:
      description: Returns the current schema migration version and dirty flag.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.MigrationVersion'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Database migration version
      tags:
      - health
      - internal
  /api/internal/data-freshness:
    get:
      description: Admin read of how fresh each ingested dataset is. last_successful_ingest_at
        and last_successful_job_id come from the newest completed job of that type.
        latest_period is the max year/month present for flight_performance and weather_observations,
        or a snapshot (as_of plus row_count) for weather_stations, countries, regions,
        airports, and airport_mct. Timestamps and periods are null when that dataset
        has never been ingested and, for snapshots, has no rows. weather_stations
