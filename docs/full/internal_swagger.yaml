    get:
      description: On-time, delay, cancellation, and diversion probabilities for one
        carrier, route, weekday, and departure window. A date selects that weekday
        in the same historical sample. A null delay on a non-empty sample means that
        delay was not observed. A route and carrier with no history are 404, not empty_sample.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Weekday (1=Mon … 7=Sun); exactly one of day_of_week or date
        in: query
        maximum: 7
        minimum: 1
        name: day_of_week
        type: integer
      - description: Calendar date (YYYY-MM-DD); exactly one of day_of_week or date
        format: date
        in: query
        name: date
        type: string
      - description: Scheduled departure time (HHmm)
        in: query
        name: dep_time
        required: true
        type: string
      - description: Minutes around dep_time to include (default 30, max 120)
        in: query
        maximum: 120
        minimum: 1
        name: dep_time_window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteOutlook'
