basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.AirportCount:
    properties:
      airport:
        type: string
      count:
        type: integer
    type: object
  model.Analysis:
    properties:
      confidence:
        description: Confidence is high, low, or unknown for sufficient, insufficient_sample,
          and empty_sample.
        enum:
        - high
        - low
        - unknown
        type: string
      end:
        type: string
      sample_reason:
        description: |-
          SampleReason is sufficient, insufficient_sample, or empty_sample.
          empty_sample is a seen route and carrier with no flights in this slot:
          confidence is unknown and estimate fields are null.
          Never-seen is 404 on route outlook, and a null outlook plus error on an itinerary leg.
        enum:
        - sufficient
        - insufficient_sample
        - empty_sample
        type: string
      sample_size:
        type: integer
      start:
        type: string
    type: object
  model.CarrierAirportStat:
    properties:
      airport:
        type: string
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierOnTime:
    properties:
      carrier:
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierRouteStat:
    properties:
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      dest:
        type: string
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
      origin:
        type: string
    type: object
  model.CarrierStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      best_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      best_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
      worst_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      worst_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
    type: object
  model.ConnectionGuidance:
    properties:
      domestic_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      domestic_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
    type: object
  model.ConnectionMinutes:
    properties:
      loose_minutes:
        type: integer
      mct_source:
        description: MCTSource is airport when this bucket used the stored airport
          minute, or default when that minute was missing.
        enum:
        - airport
        - default
        type: string
      recommended_minutes:
        type: integer
    type: object
  model.DelayCausesAvgMinutes:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      weather:
        type: number
    type: object
  model.DelayCausesShare:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      unattributed:
        type: number
      weather:
        type: number
    type: object
  model.Filters:
    properties:
      carrier:
        type: string
      day_of_week:
        type: integer
      days_of_week:
        items:
          type: integer
        type: array
      dep_time:
        type: string
      dep_time_window_minutes:
        type: integer
      dest:
        type: string
      end_date:
        type: string
      flight_number:
        type: string
      origin:
        type: string
      start_date:
        type: string
      state:
        type: string
    type: object
  model.ItineraryConnection:
    properties:
      after_leg:
        type: integer
      airport:
        type: string
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      connection_type:
        enum:
        - domestic_to_domestic
        - domestic_to_international
        - international_to_domestic
        - international_to_international
        type: string
      layover_minutes:
        type: integer
      loose_minutes:
        type: integer
      mct_source:
        description: MCTSource is airport or default when this hop used a connection
          bucket, and null otherwise.
        enum:
        - airport
        - default
        type: string
      overnight:
        description: Overnight stays true for a later outbound date, including multi-day,
          when reason names another cause.
        type: boolean
      reason:
        description: Reason is why status is unknown. overnight means a later date
          was still classified. empty_sample and insufficient_sample match the inbound
          sample_reason; missing_outlook does not.
        enum:
        - evaluated
        - overnight
        - multi_airport
        - missing_country
        - missing_outlook
        - empty_sample
        - insufficient_sample
        - missing_threshold
        - negative_layover
        - invalid_schedule
        type: string
      recommended_minutes:
        type: integer
      slack_minutes:
        type: integer
      status:
        enum:
        - loose
        - ok
        - tight
        - unknown
        type: string
    type: object
  model.ItineraryLeg:
    properties:
      arr_time:
        type: string
      carrier:
        type: string
      date:
        type: string
      dep_time:
        type: string
      dep_time_window_minutes:
        maximum: 120
        minimum: 1
        type: integer
      dest:
        type: string
      origin:
        type: string
    required:
    - arr_time
    - carrier
    - date
    - dep_time
    - dest
    - origin
    type: object
  model.ItineraryOutlookLeg:
    properties:
      date:
        type: string
      error:
        type: string
      index:
        type: integer
      outlook:
        $ref: '#/definitions/model.RouteOutlook'
    type: object
  model.ItineraryOutlookRequest:
    properties:
      legs:
        items:
          $ref: '#/definitions/model.ItineraryLeg'
        maxItems: 4
        minItems: 2
        type: array
    required:
    - legs
    type: object
  model.ItineraryOutlookResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/model.ItineraryConnection'
        type: array
      legs:
        items:
          $ref: '#/definitions/model.ItineraryOutlookLeg'
        type: array
      summary:
        allOf:
        - $ref: '#/definitions/model.ItineraryOutlookSummary'
        description: Summary is the lowest leg confidence and how many connections
          are unknown.
    type: object
  model.ItineraryOutlookSummary:
    properties:
      confidence:
        description: Confidence is the lowest leg outlook confidence. A leg with no
          outlook is unknown.
        enum:
        - high
        - low
        - unknown
        type: string
      unknown_connections:
        description: UnknownConnections counts connections whose status is unknown.
        type: integer
    type: object
  model.RouteOutlook:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      cancellation_probability:
        type: number
      connection:
        $ref: '#/definitions/model.ConnectionGuidance'
      delay_probability:
        type: number
      diversion_probability:
        type: number
      filters:
        $ref: '#/definitions/model.Filters'
      likely_arrival_delay_minutes:
        type: number
      likely_arrival_delay_when_delayed:
        type: number
      likely_departure_delay_minutes:
        type: number
      likely_departure_delay_when_delayed:
        type: number
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time_probability:
        type: number
      weather:
        allOf:
        - $ref: '#/definitions/model.RouteOutlookWeather'
        description: Weather is route-level fair and adverse on-time rates, not this
          departure slot.
    type: object
  model.RouteOutlookWeather:
    properties:
      dest:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
      origin:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
    type: object
  model.RouteOutlookWeatherSide:
    properties:
      adverse_delta:
        description: AdverseDelta is adverse_on_time_rate minus fair_on_time_rate,
          or null unless both rates exist.
        type: number
      adverse_flights:
        description: AdverseFlights counts adverse-category flights. UNKNOWN and unmatched
          flights are excluded.
        type: integer
      adverse_on_time_rate:
        description: AdverseOnTimeRate is null when this side has no adverse flights.
        type: number
      confidence:
        description: Confidence is unknown when fair or adverse flights are absent,
          and low when the thinner group is below the outlook minimum. A thin sample
          keeps its rates.
        enum:
        - high
        - low
        - unknown
        type: string
      fair_on_time_rate:
        description: FairOnTimeRate is null when this side has no VFR_FAIR flights.
        type: number
    type: object
  model.RouteStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      carrier_on_time:
        description: Present only when the carrier query filter is omitted. Sorted
          by on_time_rate desc, then flights desc, then carrier asc.
        items:
          $ref: '#/definitions/model.CarrierOnTime'
        type: array
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_airports:
        items:
          $ref: '#/definitions/model.AirportCount'
        type: array
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.RouteTravelWindows:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      best_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      best_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      best_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      by_day_of_week:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      by_hour:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      by_month:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      filters:
        $ref: '#/definitions/model.Filters'
      worst_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      worst_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      worst_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
    type: object
  model.RouteWeatherStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      dest_weather:
        $ref: '#/definitions/model.WeatherSideStats'
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      origin_weather:
        $ref: '#/definitions/model.WeatherSideStats'
    type: object
  model.TravelWindowDayBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      day_of_week:
        type: integer
      flights:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowHourBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      hour:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowMonthBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      month:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.WeatherCategoryStat:
    properties:
      category:
        description: Category is Thunder, Very low clouds or visibility, Low clouds
          or visibility, Somewhat reduced visibility, Windy, Precipitation, Fair,
          or Unknown.
        enum:
        - Thunder
        - Very low clouds or visibility
        - Low clouds or visibility
        - Somewhat reduced visibility
        - Windy
        - Precipitation
        - Fair
        - Unknown
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.WeatherSideStats:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.WeatherCategoryStat'
        type: array
      flights:
        type: integer
      flights_unmatched:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'REST API for flight data ingest, job status, route performance, and
    carrier performance. Protected routes require an API key (`Authorization: Bearer
    <key>` or `X-API-Key`). Rate-limited responses return 429 with `Retry-After`,
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.'
  title: flight-tracker API
  version: "1.0"
paths:
  /api/v1/carriers/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a marketing carrier, plus best and worst routes and airports (on-time rate,
        min 30 flights, top/bottom 5). Carrier is a 2-letter marketing IATA code.
        Dates are optional together and default to the trailing 90 days ending at
        the carrier's latest flight date (max span 366 days). When dates are omitted,
        that default window is analysis.start and analysis.end. State is a 2-letter
        code matching origin or dest. Returns 404 when the carrier has no flight-performance
        data. Date and state filters that match nothing still return 200.
      parameters:
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Range start (YYYY-MM-DD); required if end_date is set
        format: date
        in: query
        name: start_date
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date; required if start_date
          is set
        format: date
        in: query
        name: end_date
        type: string
      - description: Origin or dest state code
        in: query
        maxLength: 2
        minLength: 2
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CarrierStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Carrier performance stats
      tags:
      - carriers
      - external
  /api/v1/itineraries/outlook:
    post:
      consumes:
      - application/json
      description: Historical outlook for 2–4 ordered legs and each connection. Always
        200. A leg with no history has a null outlook and an error, not sample_reason
        empty_sample. Each leg outlook is that leg's route outlook, including filters,
        analysis, and route-level weather. summary.confidence is the lowest leg confidence,
        and a missing outlook counts as unknown. summary.unknown_connections counts
        connections with status unknown.
      parameters:
      - description: Ordered legs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ItineraryOutlookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ItineraryOutlookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Itinerary booking outlook
      tags:
      - itineraries
      - external
  /api/v1/routes/outlook:
    get:
      description: On-time, delay, cancellation, and diversion probabilities for a
        carrier/route/day/departure-time window, based on the trailing analysis period.
        Exactly one of day_of_week (1=Monday through 7=Sunday) or date (YYYY-MM-DD)
        is required; sending both or neither is rejected. A date selects that weekday
        for the same historical sample. dep_time is local departure time as HHmm (e.g.
        0700). dep_time_window_minutes defaults to 30 (max 120). analysis.sample_reason
        is sufficient when sample_size meets the minimum (confidence high), insufficient_sample
        when some flights fall short of that minimum (confidence low), and empty_sample
        when this weekday and departure window have no flights (confidence unknown,
        probability and delay fields null). A null delay field on a non-empty sample
        means that delay was not observed. Departure delay uses the same four stats
        as arrival. connection is same-airport guidance per connection type and is
        null for empty_sample and insufficient_sample. recommended_minutes is arrival-delay
        p90 plus the destination airport MCT, or 45/60/120/120 when that MCT bucket
        is missing (mct_source default; airport when the stored minute is used). It
        is the smallest layover that is ok. loose_minutes is 30 minutes above recommended_minutes.
        A shorter layover is tight. A null bucket means that connection status is
        unknown. These minutes are not an official airline MCT. Itinerary connections
        use the same thresholds and confidence. weather is route-level fair and adverse
        on-time rates for this route and carrier over the analysis window; it does
        not change confidence or connection status. Returns 404 when the origin, destination,
        and carrier have no flight-performance data. That not-found case is not empty_sample.
        A day-of-week or departure-time window that matches nothing still returns
        200.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Weekday (1=Mon … 7=Sun); exactly one of day_of_week or date
        in: query
        maximum: 7
        minimum: 1
        name: day_of_week
        type: integer
      - description: Calendar date (YYYY-MM-DD); exactly one of day_of_week or date
        format: date
        in: query
        name: date
        type: string
      - description: Scheduled departure time (HHmm)
        in: query
        name: dep_time
        required: true
        type: string
      - description: Minutes around dep_time to include (default 30, max 120)
        in: query
        maximum: 120
        minimum: 1
        name: dep_time_window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteOutlook'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Route booking outlook
      tags:
      - routes
      - external
  /api/v1/routes/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a route over a date range (max 366 days). Origin and dest are 3-letter airport
        codes. Days of week use 1=Monday through 7=Sunday. When carrier is omitted,
        carrier_on_time lists per-marketing-carrier on-time rates and flight counts
        for the same filters. The field is omitted entirely when carrier is set. Returns
        404 when the origin/destination has no flight-performance data, or when carrier
        is set and that route and carrier have none. Date, weekday, and flight-number
        filters that match nothing still return 200.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Flight number (requires carrier)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
        items:
          type: integer
