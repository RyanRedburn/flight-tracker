host: localhost:8080
info:
  contact: {}
  description: REST API for flight data ingest, job status, route performance, and
    carrier performance.
  title: flight-tracker API
  version: "1.0"
paths:
  /api/v1/carriers/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a marketing carrier, plus best and worst routes and airports (on-time rate,
        min 30 flights, top/bottom 5). Carrier is a 2-letter marketing IATA code.
        Dates are optional together and default to the trailing 90 days ending at
        the carrier's latest flight date (max span 366 days). State is a 2-letter
        code matching origin or dest.
      parameters:
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Range start (YYYY-MM-DD); required if end_date is set
        format: date
        in: query
        name: start_date
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date; required if start_date
          is set
        format: date
        in: query
        name: end_date
        type: string
      - description: Origin or dest state code
        in: query
        maxLength: 2
        minLength: 2
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CarrierStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Carrier performance stats
      tags:
      - carriers
      - external
  /api/v1/routes/outlook:
    get:
      description: On-time, delay, cancellation, and diversion probabilities for a
        carrier/route/day/departure-time window, based on the trailing analysis period.
        Day of week uses 1=Monday through 7=Sunday. dep_time is local departure time
        as HHmm (e.g. 0700). dep_time_window_minutes defaults to 30 (max 120).
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Day of week (1=Mon … 7=Sun)
        in: query
        maximum: 7
        minimum: 1
        name: day_of_week
        required: true
        type: integer
      - description: Scheduled departure time (HHmm)
        in: query
        name: dep_time
        required: true
        type: string
      - description: Minutes around dep_time to include (default 30, max 120)
        in: query
        maximum: 120
        minimum: 1
        name: dep_time_window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteOutlook'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Route booking outlook
      tags:
      - routes
      - external
  /api/v1/routes/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a route over a date range (max 366 days). Origin and dest are 3-letter airport
        codes. Days of week use 1=Monday through 7=Sunday.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Flight number (requires carrier)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
        items:
          type: integer
        maximum: 7
        minimum: 1
        name: days_of_week
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Route performance stats
      tags:
      - routes
      - external
swagger: "2.0"
