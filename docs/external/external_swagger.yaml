  /api/v1/routes/weather-stats:
    get:
      description: 'On-time performance by observed weather category at the origin
        and at the destination over a date range (max 366 days). Origin and dest are
        3-letter airport codes. Days of week use 1=Monday through 7=Sunday. Each side
        lists flight counts and on-time rate by category: thunderstorms (THUNDER),
        low ceiling or visibility (LIFR, IFR, MVFR), wind (WINDY), precipitation (PRECIP),
        fair weather (VFR_FAIR), and an observation too incomplete to classify (UNKNOWN),
        plus flights with no matching observation. Those unmatched flights are not
        treated as fair weather. Returns 404 when the origin/destination has no flight-performance
        data, or when carrier is set and that route and carrier have none. Date, weekday,
        and flight-number filters that match nothing still return 200.'
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Flight number (requires carrier)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
        items:
          type: integer
        maximum: 7
        minimum: 1
        name: days_of_week
        type: array
      produces:
      - application/json
      responses:
