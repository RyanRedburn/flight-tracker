  /api/v1/routes/travel-windows:
    get:
      description: Typical-year on-time rates by month, day of week (1=Mon … 7=Sun),
        and scheduled local departure hour, pooled from the last up to 2 years of
        flight-performance data for the origin/destination (and marketing carrier
        when set). Best/worst lists are the top and bottom 3 buckets whose flight
        count meets the grain minimum (confidence high). Each bucket's confidence
        and reliability describe that seasonal on-time rate only; they are not connection
        statuses (not loose, ok, or tight). confidence is high when flights meet the
        grain's minimum sample and low when the bucket has fewer flights. reliability
        is reliable at an on-time rate of at least 0.80, typical from 0.70 up to 0.80,
        and unreliable below 0.70, and only when confidence is high. reliability unknown
        with confidence low is a thin bucket, the seasonal form of outlook insufficient_sample,
        not a second flag and not an unreliable season. A bucket with no flights is
        omitted rather than returned as a zero rate. filters.carrier is omitted when
        the carrier query param is not set. Returns 404 when the route (or route+carrier)
        has no flight-performance data.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteTravelWindows'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Route travel windows
      tags:
      - routes
      - external
  /api/v1/routes/weather-stats:
    get:
      description: 'On-time performance by observed weather category at the origin
        and at the destination over a date range (max 366 days). Origin and dest are
        3-letter airport codes. Days of week use 1=Monday through 7=Sunday. Each side
        lists flight counts and on-time rate by category: Thunder, Very low clouds
        or visibility, Low clouds or visibility, Somewhat reduced visibility, Windy,
        Precipitation, Fair, and Unknown, plus flights with no matching observation.
        Those unmatched flights are not treated as fair weather. Returns 404 when
        the origin/destination has no flight-performance data, or when carrier is
        set and that route and carrier have none. Date, weekday, and flight-number
        filters that match nothing still return 200.'
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Flight number (requires carrier)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
        items:
          type: integer
        maximum: 7
        minimum: 1
        name: days_of_week
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteWeatherStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Route weather category stats
      tags:
      - routes
