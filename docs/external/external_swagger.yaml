basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.AirportCount:
    properties:
      airport:
        type: string
      count:
        type: integer
    type: object
  model.CarrierAirportStat:
    properties:
      airport:
        type: string
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierOnTime:
    properties:
      carrier:
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierRouteStat:
    properties:
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      dest:
        type: string
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
      origin:
        type: string
    type: object
  model.CarrierStats:
    properties:
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      best_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      best_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      carrier:
        type: string
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      end_date:
        type: string
      filters:
        $ref: '#/definitions/model.CarrierStatsFilters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
      start_date:
        type: string
      worst_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      worst_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
    type: object
  model.CarrierStatsFilters:
    properties:
      state:
        type: string
    type: object
  model.ConnectionGuidance:
    properties:
      domestic_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      domestic_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
    type: object
  model.ConnectionMinutes:
    properties:
      floor_only:
        description: |-
          FloorOnly is true when the airport MCT minute for this bucket was missing
          and the static floor was used: 45 domestic-domestic, 60 domestic-international,
          120 international. False means the airport supplied the minute, including zero.
        type: boolean
      loose_minutes:
        type: integer
      recommended_minutes:
        type: integer
    type: object
  model.DelayCausesAvgMinutes:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      weather:
        type: number
    type: object
  model.DelayCausesShare:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      unattributed:
        type: number
      weather:
        type: number
    type: object
  model.ItineraryConnection:
    properties:
      after_leg:
        type: integer
      airport:
        type: string
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      connection_type:
        enum:
        - domestic_to_domestic
        - domestic_to_international
        - international_to_domestic
        - international_to_international
        type: string
      floor_only:
        description: |-
          FloorOnly is copied from the inbound outlook bucket. True means that bucket used the static MCT floor.
          False means the airport minute was present. Null means no bucket was used.
        type: boolean
      layover_minutes:
        type: integer
      loose_minutes:
        type: integer
      overnight:
        description: |-
          Overnight is true when a positive layover uses a later outbound local date.
          It stays true when reason names a different unknown cause.
        type: boolean
      reason:
        description: |-
          Reason explains status. evaluated is a same-day classification.
          overnight is a classified connection whose outbound local date is later, including multi-day.
          multi_airport means the airports differ. missing_country means the domestic/international type cannot be determined.
          missing_outlook means the inbound leg has no outlook, which is the route-outlook 404 case and not empty_sample.
          empty_sample and insufficient_sample are the inbound sample_reason, so status stays unknown and confidence stays unknown or low.
          missing_threshold means a sufficient sample has no bucket for this type.
          negative_layover means departure is before arrival. invalid_schedule means the layover date or clock could not be read.
        enum:
        - evaluated
        - overnight
        - multi_airport
        - missing_country
        - missing_outlook
        - empty_sample
        - insufficient_sample
        - missing_threshold
        - negative_layover
        - invalid_schedule
        type: string
      recommended_minutes:
        type: integer
      slack_minutes:
        type: integer
      status:
        enum:
        - loose
        - ok
        - tight
        - unknown
        type: string
    type: object
  model.ItineraryLeg:
    properties:
      arr_time:
        type: string
      carrier:
        type: string
      date:
        type: string
      dep_time:
        type: string
      dep_time_window_minutes:
        maximum: 120
        minimum: 1
        type: integer
      dest:
        type: string
      origin:
        type: string
    required:
    - arr_time
    - carrier
    - date
    - dep_time
    - dest
    - origin
    type: object
  model.ItineraryOutlookLeg:
    properties:
      arr_time:
        type: string
      carrier:
        type: string
      date:
        type: string
      day_of_week:
        type: integer
      dep_time:
        type: string
      dep_time_window_minutes:
        type: integer
      dest:
        type: string
      error:
        type: string
      index:
        type: integer
      origin:
        type: string
      outlook:
        $ref: '#/definitions/model.RouteOutlook'
    type: object
  model.ItineraryOutlookRequest:
    properties:
      legs:
        items:
          $ref: '#/definitions/model.ItineraryLeg'
        maxItems: 4
        minItems: 2
        type: array
    required:
    - legs
    type: object
  model.ItineraryOutlookResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/model.ItineraryConnection'
        type: array
      legs:
        items:
          $ref: '#/definitions/model.ItineraryOutlookLeg'
        type: array
    type: object
  model.RouteOutlook:
    properties:
      analysis_end:
        type: string
      analysis_start:
        type: string
      cancellation_probability:
        type: number
      carrier:
        type: string
      confidence:
        description: Confidence is high, low, or unknown for sufficient, insufficient_sample,
          and empty_sample.
        enum:
        - high
        - low
        - unknown
        type: string
      connection:
        $ref: '#/definitions/model.ConnectionGuidance'
      day_of_week:
        type: integer
      delay_probability:
        type: number
      dep_time:
        type: string
      dep_time_window_minutes:
        type: integer
      dest:
        type: string
      diversion_probability:
        type: number
      insufficient_sample:
        description: |-
          InsufficientSample is true only for sample_reason insufficient_sample.
          An empty slot leaves it false; never-seen is not this flag.
        type: boolean
      likely_arrival_delay_minutes:
        type: number
      likely_arrival_delay_when_delayed:
        type: number
      likely_departure_delay_minutes:
        type: number
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      on_time_probability:
        type: number
      origin:
        type: string
      sample_reason:
        description: |-
          SampleReason is sufficient, insufficient_sample, or empty_sample.
          insufficient_sample matches the bool. empty_sample is a seen route and carrier
          with no flights in this slot: confidence is unknown and estimate fields are null.
          Never-seen is 404 on route outlook, and a null outlook plus error on an itinerary leg.
        enum:
        - sufficient
        - insufficient_sample
        - empty_sample
        type: string
      sample_size:
        type: integer
    type: object
  model.RouteStats:
    properties:
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      carrier_on_time:
        description: Present only when the carrier query filter is omitted. Sorted
          by on_time_rate desc, then flights desc, then carrier asc.
        items:
          $ref: '#/definitions/model.CarrierOnTime'
        type: array
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      dest:
        type: string
      diversion_airports:
        items:
          $ref: '#/definitions/model.AirportCount'
        type: array
      diversion_rate:
        type: number
      diverted:
        type: integer
      end_date:
        type: string
      filters:
        $ref: '#/definitions/model.RouteStatsFilters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
      origin:
        type: string
      start_date:
        type: string
    type: object
  model.RouteStatsFilters:
    properties:
      carrier:
        type: string
      days_of_week:
        items:
          type: integer
        type: array
      flight_number:
        type: string
    type: object
  model.RouteTravelWindows:
    properties:
      best_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      best_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      best_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      by_day_of_week:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      by_hour:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      by_month:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      carrier:
        type: string
      dest:
        type: string
      origin:
        type: string
      window_end:
        type: string
      window_start:
        type: string
      worst_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      worst_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      worst_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
    type: object
  model.RouteWeatherStats:
    properties:
      dest:
        type: string
      dest_weather:
        $ref: '#/definitions/model.WeatherSideStats'
      end_date:
        type: string
      filters:
        $ref: '#/definitions/model.RouteStatsFilters'
      flights:
        type: integer
      origin:
        type: string
      origin_weather:
        $ref: '#/definitions/model.WeatherSideStats'
      start_date:
        type: string
    type: object
  model.TravelWindowDayBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      day_of_week:
        type: integer
      flights:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowHourBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      hour:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowMonthBucket:
    properties:
      confidence:
        enum:
        - high
        - low
        - unknown
        type: string
      flights:
        type: integer
      month:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.WeatherCategoryStat:
    properties:
      category:
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.WeatherSideStats:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.WeatherCategoryStat'
        type: array
      flights:
        type: integer
      flights_unmatched:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'REST API for flight data ingest, job status, route performance, and
    carrier performance. Protected routes require an API key (`Authorization: Bearer
    <key>` or `X-API-Key`). Rate-limited responses return 429 with `Retry-After`,
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.'
  title: flight-tracker API
  version: "1.0"
paths:
  /api/v1/carriers/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a marketing carrier, plus best and worst routes and airports (on-time rate,
        min 30 flights, top/bottom 5). Carrier is a 2-letter marketing IATA code.
        Dates are optional together and default to the trailing 90 days ending at
        the carrier's latest flight date (max span 366 days). State is a 2-letter
        code matching origin or dest. Returns 404 when the carrier has no flight-performance
        data. Date and state filters that match nothing still return 200.
      parameters:
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Range start (YYYY-MM-DD); required if end_date is set
        format: date
        in: query
        name: start_date
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date; required if start_date
          is set
        format: date
        in: query
        name: end_date
        type: string
      - description: Origin or dest state code
        in: query
        maxLength: 2
        minLength: 2
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CarrierStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Carrier performance stats
      tags:
      - carriers
      - external
  /api/v1/itineraries/outlook:
    post:
      consumes:
      - application/json
      description: 'Historical outlook for each of 2–4 ordered legs, plus connection
        risk between adjacent legs. Each leg uses the same sample as route outlook,
        with weekday taken from its date. A valid body always returns 200. A leg whose
        origin, destination, and carrier have no flight-performance history has a
        null outlook and an error; that is the route-outlook 404 case, not sample_reason
        empty_sample. A seen leg embeds the route outlook, including sample_reason:
        empty_sample (confidence unknown, estimate fields null, insufficient_sample
        false), insufficient_sample (confidence low, the bool true), or sufficient
        (confidence high). status is loose when layover_minutes is at least loose_minutes,
        ok when it meets recommended_minutes but not loose_minutes, tight when shorter,
        and unknown when the layover or the inbound threshold is missing. Thresholds
        are missing for empty_sample and insufficient_sample, so status stays unknown;
        a classified same-airport connection still copies that outlook confidence
        (unknown or low). recommended_minutes and loose_minutes are copied from the
        inbound outlook connection bucket for connection_type. confidence matches
        that outlook for a classified same-airport connection. It stays unknown when
        the airports differ or the connection type cannot be classified, even if the
        inbound outlook confidence is high. A negative gap is not a layover, so status
        stays unknown even when thresholds are present. reason is evaluated for a
        same-day classification, overnight when the outbound local date is later (including
        multi-day) and the hop was still classified, multi_airport when the airports
        differ, missing_country when the domestic/international type cannot be determined,
        missing_outlook when the inbound leg has no outlook, empty_sample or insufficient_sample
        from the inbound sample_reason, missing_threshold when a sufficient sample
        has no bucket for that type, negative_layover when departure is before arrival,
        and invalid_schedule when the layover cannot be read. overnight is also true
        for a later outbound date when another reason explains unknown. floor_only
        is copied from that bucket and is null when no bucket was used.'
      parameters:
      - description: Ordered legs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ItineraryOutlookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ItineraryOutlookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Itinerary booking outlook
      tags:
      - itineraries
      - external
  /api/v1/routes/outlook:
    get:
      description: On-time, delay, cancellation, and diversion probabilities for a
        carrier/route/day/departure-time window, based on the trailing analysis period.
        Exactly one of day_of_week (1=Monday through 7=Sunday) or date (YYYY-MM-DD)
        is required; sending both or neither is rejected. A date selects that weekday
        for the same historical sample. dep_time is local departure time as HHmm (e.g.
        0700). dep_time_window_minutes defaults to 30 (max 120). sample_reason is
        sufficient when sample_size meets the minimum (insufficient_sample false,
        confidence high), insufficient_sample when some flights fall short of that
        minimum (the bool is true, confidence low), and empty_sample when this weekday
        and departure window have no flights (insufficient_sample stays false, confidence
        unknown, probability and delay fields null). A null delay field on a non-empty
        sample means that delay was not observed. connection is same-airport guidance
        per connection type and is null for empty_sample and insufficient_sample.
        recommended_minutes is arrival-delay p90 plus the destination airport MCT,
        or 45/60/120/120 when that MCT bucket is missing; it is the smallest layover
        that is ok. floor_only is true when that static floor was used because the
        airport minute was missing, and false when the airport minute was present,
        including zero. A missing MCT minute is still a published bucket. loose_minutes
        is 30 minutes above recommended_minutes. A shorter layover is tight. A null
        bucket means that connection type was not estimated (empty_sample, insufficient_sample,
        or no delay estimate), not a missing MCT minute, so that connection status
        is unknown. These minutes are not an official airline MCT. Itinerary connections
        use the same thresholds, floor_only, and confidence. Returns 404 when the
        origin, destination, and carrier have no flight-performance data. That not-found
        case is not empty_sample. A day-of-week or departure-time window that matches
        nothing still returns 200.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Weekday (1=Mon … 7=Sun); exactly one of day_of_week or date
        in: query
        maximum: 7
        minimum: 1
        name: day_of_week
        type: integer
      - description: Calendar date (YYYY-MM-DD); exactly one of day_of_week or date
        format: date
        in: query
        name: date
        type: string
      - description: Scheduled departure time (HHmm)
        in: query
        name: dep_time
        required: true
        type: string
      - description: Minutes around dep_time to include (default 30, max 120)
        in: query
        maximum: 120
        minimum: 1
        name: dep_time_window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteOutlook'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Route booking outlook
      tags:
      - routes
      - external
  /api/v1/routes/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a route over a date range (max 366 days). Origin and dest are 3-letter airport
        codes. Days of week use 1=Monday through 7=Sunday. When carrier is omitted,
        carrier_on_time lists per-marketing-carrier on-time rates and flight counts
        for the same filters. The field is omitted entirely when carrier is set. Returns
        404 when the origin/destination has no flight-performance data, or when carrier
        is set and that route and carrier have none. Date, weekday, and flight-number
        filters that match nothing still return 200.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Flight number (requires carrier)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
