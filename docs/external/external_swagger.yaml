basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  model.AirportCount:
    properties:
      airport:
        type: string
      count:
        type: integer
    type: object
  model.Analysis:
    properties:
      confidence:
        description: 'Outlook only: low under 30 flights, medium 30–49, high 50 or
          more.'
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      end:
        type: string
      lookback_days:
        description: 'Outlook only. Days of history used: 365, or 730 when dep_time_window_minutes
          was not set and the last 365 days had fewer than 30 flights.'
        type: integer
      sample_reason:
        description: |-
          empty_sample means the slot has no flights: confidence is unknown and estimates are null.
          sufficient covers medium and high. insufficient_sample is low.
        enum:
        - sufficient
        - insufficient_sample
        - empty_sample
        type: string
      sample_size:
        type: integer
      start:
        type: string
    type: object
  model.CarrierAirportStat:
    properties:
      airport:
        type: string
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierOnTime:
    properties:
      carrier:
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.CarrierRouteStat:
    properties:
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_rate:
        type: number
      delayed:
        type: integer
      dest:
        type: string
      diversion_rate:
        type: number
      diverted:
        type: integer
      flights:
        type: integer
      on_time:
        type: integer
      on_time_rate:
        type: number
      origin:
        type: string
    type: object
  model.CarrierStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      best_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      best_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
      worst_airports:
        items:
          $ref: '#/definitions/model.CarrierAirportStat'
        type: array
      worst_routes:
        items:
          $ref: '#/definitions/model.CarrierRouteStat'
        type: array
    type: object
  model.ConnectionGuidance:
    properties:
      domestic_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      domestic_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_domestic:
        $ref: '#/definitions/model.ConnectionMinutes'
      international_to_international:
        $ref: '#/definitions/model.ConnectionMinutes'
    type: object
  model.ConnectionMinutes:
    properties:
      loose_minutes:
        type: integer
      mct_source:
        description: MCTSource is airport when this bucket used the stored airport
          minute, or default when that minute was missing.
        enum:
        - airport
        - default
        type: string
      recommended_minutes:
        type: integer
    type: object
  model.DelayCausesAvgMinutes:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      weather:
        type: number
    type: object
  model.DelayCausesShare:
    properties:
      carrier:
        type: number
      late_aircraft:
        type: number
      nas:
        type: number
      security:
        type: number
      unattributed:
        type: number
      weather:
        type: number
    type: object
  model.Filters:
    properties:
      carrier:
        type: string
      day_of_week:
        type: integer
      days_of_week:
        items:
          type: integer
        type: array
      dep_time:
        type: string
      dep_time_window_minutes:
        type: integer
      dest:
        type: string
      end_date:
        type: string
      flight_number:
        type: string
      origin:
        type: string
      start_date:
        type: string
      state:
        type: string
    type: object
  model.ItineraryConnection:
    properties:
      after_leg:
        type: integer
      airport:
        type: string
      confidence:
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      connection_type:
        enum:
        - domestic_to_domestic
        - domestic_to_international
        - international_to_domestic
        - international_to_international
        type: string
      layover_minutes:
        type: integer
      loose_minutes:
        type: integer
      mct_source:
        description: Null when this hop did not use a connection bucket.
        enum:
        - airport
        - default
        type: string
      overnight:
        description: Overnight stays true for a later outbound date, including multi-day,
          when reason names another cause.
        type: boolean
      reason:
        description: 'Why status is unknown. overnight is the exception: a later outbound
          date was still classified. empty_sample means the inbound slot has no flights.
          A low-confidence slot is still classified.'
        enum:
        - evaluated
        - overnight
        - multi_airport
        - missing_country
        - missing_outlook
        - empty_sample
        - missing_threshold
        - negative_layover
        - invalid_schedule
        type: string
      recommended_minutes:
        type: integer
      slack_minutes:
        type: integer
      status:
        enum:
        - loose
        - ok
        - tight
        - unknown
        type: string
    type: object
  model.ItineraryLeg:
    properties:
      arr_time:
        type: string
      carrier:
        type: string
      date:
        type: string
      dep_time:
        type: string
      dep_time_window_minutes:
        maximum: 120
        minimum: 1
        type: integer
      dest:
        type: string
      origin:
        type: string
    required:
    - arr_time
    - carrier
    - date
    - dep_time
    - dest
    - origin
    type: object
  model.ItineraryOutlookLeg:
    properties:
      date:
        type: string
      error:
        type: string
      index:
        type: integer
      outlook:
        $ref: '#/definitions/model.RouteOutlook'
    type: object
  model.ItineraryOutlookRequest:
    properties:
      legs:
        items:
          $ref: '#/definitions/model.ItineraryLeg'
        maxItems: 4
        minItems: 2
        type: array
    required:
    - legs
    type: object
  model.ItineraryOutlookResponse:
    properties:
      connections:
        items:
          $ref: '#/definitions/model.ItineraryConnection'
        type: array
      legs:
        items:
          $ref: '#/definitions/model.ItineraryOutlookLeg'
        type: array
      summary:
        $ref: '#/definitions/model.ItineraryOutlookSummary'
    type: object
  model.ItineraryOutlookSummary:
    properties:
      confidence:
        description: The lowest confidence among the legs.
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      connection_risk:
        description: True when any connection is tight or unknown.
        type: boolean
      destination:
        type: string
      origin:
        type: string
    type: object
  model.RouteOutlook:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      cancellation_probability:
        type: number
      connection:
        allOf:
        - $ref: '#/definitions/model.ConnectionGuidance'
        description: Empty when the slot has no flights. Present at any confidence
          otherwise.
      delay_probability:
        type: number
      diversion_probability:
        type: number
      filters:
        $ref: '#/definitions/model.Filters'
      likely_arrival_delay_minutes:
        type: number
      likely_arrival_delay_when_delayed:
        type: number
      likely_departure_delay_minutes:
        type: number
      likely_departure_delay_when_delayed:
        type: number
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time_probability:
        type: number
      weather:
        $ref: '#/definitions/model.RouteOutlookWeather'
    type: object
  model.RouteOutlookWeather:
    properties:
      dest:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
      origin:
        $ref: '#/definitions/model.RouteOutlookWeatherSide'
    type: object
  model.RouteOutlookWeatherSide:
    properties:
      adverse_delta:
        description: AdverseDelta is adverse_on_time_rate minus fair_on_time_rate,
          or null unless both rates exist.
        type: number
      adverse_flights:
        description: AdverseFlights counts adverse-category flights. UNKNOWN and unmatched
          flights are excluded.
        type: integer
      adverse_on_time_rate:
        description: AdverseOnTimeRate is null when this side has no adverse flights.
        type: number
      confidence:
        description: 'Based on the smaller of the fair and adverse flight counts:
          low under 30, medium 30–49, high 50 or more. Unknown when either count is
          zero.'
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      fair_on_time_rate:
        description: FairOnTimeRate is null when this side has no VFR_FAIR flights.
        type: number
    type: object
  model.RouteStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      avg_arrival_delay_minutes:
        type: number
      avg_arrival_delay_when_delayed:
        type: number
      avg_departure_delay_minutes:
        type: number
      avg_departure_delay_when_delayed:
        type: number
      cancellation_rate:
        type: number
      cancelled:
        type: integer
      carrier_comparison:
        description: |-
          ranked: the most reliable carrier (highest on-time rate, allowing for sample size) differs from at least one other at 95% statistical significance.
          too_close_to_call: it differs significantly from none. Omitted when fewer than two carriers have flights.
        enum:
        - ranked
        - too_close_to_call
        type: string
      carrier_on_time:
        description: Present only when the carrier query filter is omitted. Sorted
          by on_time_rate desc, then flights desc, then carrier asc.
        items:
          $ref: '#/definitions/model.CarrierOnTime'
        type: array
      delay_causes_avg_minutes:
        $ref: '#/definitions/model.DelayCausesAvgMinutes'
      delay_causes_share:
        $ref: '#/definitions/model.DelayCausesShare'
      delay_rate:
        type: number
      delayed:
        type: integer
      diversion_airports:
        items:
          $ref: '#/definitions/model.AirportCount'
        type: array
      diversion_rate:
        type: number
      diverted:
        type: integer
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      median_arrival_delay_minutes:
        type: number
      median_arrival_delay_when_delayed:
        type: number
      median_departure_delay_minutes:
        type: number
      median_departure_delay_when_delayed:
        type: number
      on_time:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.RouteTravelWindows:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      best_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      best_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      best_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      by_day_of_week:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      by_hour:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      by_month:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
      day_comparison:
        description: Same values and rules as month_comparison, for best_days and
          worst_days.
        enum:
        - ranked
        - too_close_to_call
        - single
        type: string
      filters:
        $ref: '#/definitions/model.Filters'
      hour_comparison:
        description: Same values and rules as month_comparison, for best_hours and
          worst_hours.
        enum:
        - ranked
        - too_close_to_call
        - single
        type: string
      month_comparison:
        description: |-
          ranked: the most reliable month (highest on-time rate, allowing for sample size) differs from at least one other month at 95% statistical significance.
          best_months is that month plus months not significantly different from it. worst_months is the least reliable month it beats plus months not significantly different from that one.
          Each list has at most 3 months and they never overlap.
          too_close_to_call: no month differs significantly from the most reliable one. single: only one month has flights. Both leave the lists empty.
          Omitted when no month has flights.
        enum:
        - ranked
        - too_close_to_call
        - single
        type: string
      worst_days:
        items:
          $ref: '#/definitions/model.TravelWindowDayBucket'
        type: array
      worst_hours:
        items:
          $ref: '#/definitions/model.TravelWindowHourBucket'
        type: array
      worst_months:
        items:
          $ref: '#/definitions/model.TravelWindowMonthBucket'
        type: array
    type: object
  model.RouteWeatherStats:
    properties:
      analysis:
        $ref: '#/definitions/model.Analysis'
      dest_weather:
        $ref: '#/definitions/model.WeatherSideStats'
      filters:
        $ref: '#/definitions/model.Filters'
      flights:
        type: integer
      origin_weather:
        $ref: '#/definitions/model.WeatherSideStats'
    type: object
  model.TravelWindowDayBucket:
    properties:
      confidence:
        description: Low under 30 flights, medium 30–49, high 50 or more.
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      day_of_week:
        type: integer
      flights:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowHourBucket:
    properties:
      confidence:
        description: Low under 30 flights, medium 30–49, high 50 or more.
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      flights:
        type: integer
      hour:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.TravelWindowMonthBucket:
    properties:
      confidence:
        description: Low under 30 flights, medium 30–49, high 50 or more.
        enum:
        - high
        - medium
        - low
        - unknown
        type: string
      flights:
        type: integer
      month:
        type: integer
      on_time_rate:
        type: number
      reliability:
        enum:
        - reliable
        - typical
        - unreliable
        - unknown
        type: string
    type: object
  model.WeatherCategoryStat:
    properties:
      category:
        enum:
        - Thunder
        - Very low clouds or visibility
        - Low clouds or visibility
        - Somewhat reduced visibility
        - Windy
        - Precipitation
        - Fair
        - Unknown
        type: string
      flights:
        type: integer
      on_time_rate:
        type: number
    type: object
  model.WeatherSideStats:
    properties:
      categories:
        items:
          $ref: '#/definitions/model.WeatherCategoryStat'
        type: array
      flights:
        type: integer
      flights_unmatched:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: 'REST API for flight data ingest, job status, route performance, and
    carrier performance. Protected routes require an API key (`Authorization: Bearer
    <key>` or `X-API-Key`). Rate-limited responses return 429 with `Retry-After`,
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, and `X-RateLimit-Reset`.'
  title: flight-tracker API
  version: "1.0"
paths:
  /api/v1/carriers/stats:
    get:
      description: On-time stats for a marketing carrier, plus best and worst routes
        and airports (on-time rate, at least 30 flights, top and bottom 5). Dates
        are optional and default to the trailing 90 days ending at the carrier's latest
        flight date (max span 366 days).
      parameters:
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Range start (YYYY-MM-DD); required if end_date is set
        format: date
        in: query
        name: start_date
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date; required if start_date
          is set
        format: date
        in: query
        name: end_date
        type: string
      - description: Origin or dest state code
        in: query
        maxLength: 2
        minLength: 2
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CarrierStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Carrier performance stats
      tags:
      - carriers
      - external
  /api/v1/itineraries/outlook:
    post:
      consumes:
      - application/json
      description: Historical outlook for 2–4 ordered legs and each connection. Always
        200. A leg with no history has a null outlook and an error, not empty_sample.
      parameters:
      - description: Ordered legs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ItineraryOutlookRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ItineraryOutlookResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Itinerary booking outlook
      tags:
      - itineraries
      - external
  /api/v1/routes/outlook:
    get:
      description: On-time, delay, cancellation, and diversion probabilities for one
        carrier, route, weekday, and departure window. A date selects that weekday
        in the same historical sample. A null delay on a non-empty sample means that
        delay was not observed.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Marketing carrier code
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        required: true
        type: string
      - description: Weekday (1=Mon … 7=Sun); exactly one of day_of_week or date
        in: query
        maximum: 7
        minimum: 1
        name: day_of_week
        type: integer
      - description: Calendar date (YYYY-MM-DD); exactly one of day_of_week or date
        format: date
        in: query
        name: date
        type: string
      - description: Scheduled departure time (HHmm)
        in: query
        name: dep_time
        required: true
        type: string
      - description: Minutes around dep_time to include (default 60, max 120)
        in: query
        maximum: 120
        minimum: 1
        name: dep_time_window_minutes
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteOutlook'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Route booking outlook
      tags:
      - routes
      - external
  /api/v1/routes/stats:
    get:
      description: Aggregated on-time, delay, cancellation, and diversion stats for
        a route over a date range (max 366 days). When carrier is omitted, carrier_on_time
        lists per-marketing-carrier on-time rates and flight counts for the same filters.
        carrier_comparison says whether those carriers can be ranked. Both fields
        are omitted when carrier is set.
      parameters:
      - description: Origin airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: origin
        required: true
        type: string
      - description: Destination airport IATA code
        in: query
        maxLength: 3
        minLength: 3
        name: dest
        required: true
        type: string
      - description: Range start (YYYY-MM-DD)
        format: date
        in: query
        name: start_date
        required: true
        type: string
      - description: Range end (YYYY-MM-DD), on or after start_date
        format: date
        in: query
        name: end_date
        required: true
        type: string
      - description: Marketing carrier code (required if flight_number is set)
        in: query
        maxLength: 2
        minLength: 2
        name: carrier
        type: string
      - description: Marketing flight number, 1 to 4 digits; leading zeros are ignored
          (0123 and 123 match)
        in: query
        name: flight_number
        type: string
      - collectionFormat: multi
        description: Filter to these weekdays (1=Mon … 7=Sun)
        in: query
        items:
          type: integer
        maximum: 7
        minimum: 1
        name: days_of_week
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RouteStats'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
